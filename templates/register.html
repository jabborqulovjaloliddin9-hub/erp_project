<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish | ERP Tizimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 my-8">
        <div class="bg-indigo-900 text-white p-6 text-center">
            <h1 class="text-3xl font-bold tracking-wider mb-2">ERP<span class="text-indigo-400">Hub</span></h1>
            <p class="text-indigo-200">Ta'limni boshqarish tizimi - Yangi profil yaratish</p>
        </div>
        
        <div class="p-8">
            
            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-md">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700">{{ error }}</p>
                    </div>
                </div>
            </div>
            {% endif %}

            <form action="{% url 'register' %}" method="POST" class="space-y-4">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ism (*)</label>
                        <input type="text" name="first_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Alisher">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Familiya (*)</label>
                        <input type="text" name="last_name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Azizov">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sharifi (Otasining ismi)</label>
                    <input type="text" name="middle_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Bahodir o'g'li">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Rolingizni tanlang</label>
                        <select name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                            <option value="student">O'quvchi (Student)</option>
                            <option value="teacher">O'qituvchi (Teacher)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Login (Username) (*)</label>
                        <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Yangi login kiriting">
                    </div>
                </div>

                <div class="pt-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Parol yarating (*)</label>
                    <input type="password" name="password" required minlength="6" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="Kamida 6 ta belgi">
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-200 transform hover:scale-[1.01]">
                        Ro'yxatdan o'tish
                    </button>
                    <p class="text-xs text-gray-500 text-center mt-3">Tugmani bosish orqali, ruxsatingiz adminga tasdiqlash uchun yuboriladi.</p>
                </div>
            </form>
            
            <div class="mt-6 text-center text-sm text-gray-600 border-t pt-6">
                Allaqachon ro'yxatdan o'tganmisiz? <a href="{% url 'login' %}" class="text-indigo-600 hover:text-indigo-800 font-bold">Tizimga kiring</a>
            </div>
        </div>
    </div>

</body>
</html>
